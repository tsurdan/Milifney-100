title: חדשות מלפני מאה
tagline: "ההיסטוריה חוזרת ∞"
description: ידיעות אמיתיות מהעיתונות העברית של לפני מאה שנה, מתפרסמות כאילו קרו היום.
url: "https://milifney100.com"
baseurl: ""
lang: he
direction: rtl
timezone: Asia/Jerusalem

permalink: /:year/:month/:day/:title/

collections:
  articles:
    output: true
    permalink: /articles/:name/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
  - scope:
      path: ""
      type: "articles"
    values:
      layout: article

exclude:
  - scripts/
  - newsletter-worker/
  - seo-docs/
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE

title: חדשות מלפני מאה
tagline: "ההיסטוריה חוזרת ∞"
description: ידיעות אמיתיות מהעיתונות העברית של לפני מאה שנה, מתפרסמות כאילו קרו היום.
url: "https://milifney100.com"
baseurl: ""
lang: he
direction: rtl
timezone: Asia/Jerusalem

# OAuth "Web application" client ID used by the Google Sign-In on /admin/ (public value).
# Must match GOOGLE_CLIENT_ID in newsletter-worker/wrangler.toml.
admin_google_client_id: "886632844292-6948r1v5c0r0s5oggu2sr2engbr0375i.apps.googleusercontent.com"

permalink: /:year/:month/:day/:title/

collections:
  articles:
    output: true
    permalink: /articles/:name/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
  - scope:
      path: ""
      type: "articles"
    values:
      layout: article

exclude:
  - scripts/
  - newsletter-worker/
  - seo-docs/
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE

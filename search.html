---
layout: default
title: חיפוש
description: חפשו בארכיון הידיעות של חדשות מלפני מאה לפי נושא, מילה או תאריך.
---
<div class="search-page">
  <form class="search-page-form" action="{{ '/search' | relative_url }}" method="get">
    <input type="search" name="q" placeholder="חיפוש בידיעות..." class="search-page-input" autocomplete="off">
    <button type="submit" class="search-page-submit">חפש</button>
    <button type="button" class="panel-date-btn" id="btn-date-page" aria-label="בחר תאריך" title="בחר תאריך">
      <svg viewBox="0 0 24 24" width="20" height="20"><rect x="3" y="4" width="18" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><line x1="3" y1="10" x2="21" y2="10" stroke="currentColor" stroke-width="2"/><line x1="8" y1="2" x2="8" y2="6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="16" y1="2" x2="16" y2="6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </form>
  <p class="search-query-display"></p>
  <div class="search-source-filters">
    <span class="search-filter-label">מקור:</span>
    <button class="search-filter-btn active" data-source="">הכל <span class="filter-count"></span></button>
    <button class="search-filter-btn" data-source="דבר">דבר <span class="filter-count"></span></button>
    <button class="search-filter-btn" data-source="דאר היום">דאר היום <span class="filter-count"></span></button>
    <button class="search-filter-btn" data-source="הארץ">הארץ <span class="filter-count"></span></button>
    <button class="search-filter-btn" data-source="כתובים">כתובים <span class="filter-count"></span></button>
  </div>
  <div class="search-results"></div>
  <p class="search-no-results" style="display:none;">לא נמצאו תוצאות.</p>
</div>

<script>
(function() {
  const params = new URLSearchParams(window.location.search);
  const query = (params.get('q') || '').trim();
  const dateFilter = params.get('date') || '';
  const sourceFilter = params.get('source') || '';

  // Secret admin access
  if (query.toLowerCase() === 'admin') {
    window.location.href = '{{ "/newsletter-admin/" | relative_url }}';
    return;
  }

  const queryDisplay = document.querySelector('.search-query-display');
  const resultsContainer = document.querySelector('.search-results');
  const noResults = document.querySelector('.search-no-results');
  const pageSearchInput = document.querySelector('.search-page-input');
  const datePicker = document.getElementById('filter-date');
  const filterBtns = document.querySelectorAll('.search-filter-btn');
  const btnDatePage = document.getElementById('btn-date-page');

  if (pageSearchInput && query) pageSearchInput.value = query;
  if (datePicker && dateFilter) datePicker.value = dateFilter;
  if (btnDatePage) {
    btnDatePage.addEventListener('click', function(e) {
      if (window.openDatePicker) window.openDatePicker(e);
    });
  }

  // Activate the matching source filter button
  if (sourceFilter) {
    filterBtns.forEach(function(btn) {
      btn.classList.toggle('active', btn.dataset.source === sourceFilter);
    });
  }

  // Source filter button clicks
  filterBtns.forEach(function(btn) {
    btn.addEventListener('click', function() {
      var newParams = new URLSearchParams(window.location.search);
      var src = btn.dataset.source;
      if (src) {
        newParams.set('source', src);
      } else {
        newParams.delete('source');
      }
      window.location.search = newParams.toString();
    });
  });

  if (query) {
    queryDisplay.textContent = 'חיפוש: "' + query + '"';
  } else if (dateFilter) {
    var parts = dateFilter.split('-');
    var display = parts[2] + '.' + parts[1] + '.' + parts[0];
    queryDisplay.textContent = 'ידיעות מתאריך ' + display;
  }

  function highlightText(text, terms) {
    if (!terms.length) return escapeHtml(text);
    var escaped = escapeHtml(text);
    terms.forEach(function(term) {
      var re = new RegExp('(' + escapeRegex(term) + ')', 'gi');
      escaped = escaped.replace(re, '<mark>$1</mark>');
    });
    return escaped;
  }

  function escapeHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function escapeRegex(str) {
    return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }

  // Source names for counting
  var sourceNames = ['דבר', 'דאר היום', 'הארץ', 'כתובים'];

  fetch('{{ "/search.json" | relative_url }}')
    .then(function(r) { return r.json(); })
    .then(function(posts) {
      // First filter by query and date (base results for counting)
      var baseResults = posts;
      var terms = [];

      if (query) {
        terms = query.toLowerCase().split(/\s+/);
        baseResults = baseResults.filter(function(post) {
          var text = (post.title + ' ' + post.content).toLowerCase();
          return terms.every(function(t) { return text.includes(t); });
        });
      }

      if (dateFilter) {
        baseResults = baseResults.filter(function(post) {
          return post.date_iso === dateFilter || post.date_iso.startsWith(dateFilter);
        });
      }

      // Count results per source
      var totalCount = baseResults.length;
      var sourceCounts = {};
      sourceNames.forEach(function(src) {
        sourceCounts[src] = baseResults.filter(function(post) {
          return post.image_alt && post.image_alt.includes(src);
        }).length;
      });

      // Update filter button counts
      filterBtns.forEach(function(btn) {
        var countEl = btn.querySelector('.filter-count');
        if (!countEl) return;
        var src = btn.dataset.source;
        var count = src ? (sourceCounts[src] || 0) : totalCount;
        countEl.textContent = '(' + count + ')';
      });

      var results = baseResults;

      if (sourceFilter) {
        results = results.filter(function(post) {
          return post.image_alt && post.image_alt.includes(sourceFilter);
        });
      }

      if (results.length === 0) {
        noResults.style.display = 'block';
        return;
      }

      results.forEach(function(post) {
        var article = document.createElement('article');
        article.className = 'search-result-item';
        var titleHtml = highlightText(post.title, terms);
        var snippet = post.content.substring(0, 180);
        var snippetHtml = highlightText(snippet, terms);

        article.innerHTML =
          '<a href="' + post.url + '" class="search-result-link">' +
            (post.image ? '<img src="' + post.image + '" alt="" class="search-result-img" loading="lazy">' : '') +
            '<div class="search-result-body">' +
              '<time>' + post.date + '</time>' +
              '<h3>' + titleHtml + '</h3>' +
              '<p>' + snippetHtml + '...</p>' +
            '</div>' +
          '</a>';
        resultsContainer.appendChild(article);
      });
    });
})();
</script>

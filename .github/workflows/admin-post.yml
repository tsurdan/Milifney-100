name: Admin Post

on:
  # Dispatched by the Cloudflare Worker (newsletter-worker/) after an admin action in /admin/.
  # The Worker commits the request to _admin_inbox/ (plus any uploaded images) first.
  workflow_dispatch:

permissions:
  contents: write

# Shared with fetch-tweets.yml so the two never push at the same time. Every run applies
# everything in _admin_inbox/, so a superseded queued run loses nothing.
concurrency:
  group: site-update
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Apply admin requests (create / edit / delete) and enrich new posts
        id: apply
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/admin_apply.py --enrich

      - name: Exclude posts marked with '**' from the website
        run: python scripts/apply_ignore_marker.py

      - name: Regenerate date, story and related-post data
        continue-on-error: true
        run: python scripts/generate_site_data.py

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Apply admin changes"
          for attempt in 1 2 3; do
            git push && break
            git pull --rebase
          done

      - name: Fail if a request could not be applied
        if: steps.apply.outcome == 'failure'
        run: |
          echo "A request failed; see _admin_inbox/_failed/ and the log above."
          exit 1

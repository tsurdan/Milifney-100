druze-revolt:
  name: המרד הדרוזי בסוריה
  hero: "1954233715384783045"
  chapters:
    - title: ההתקוממות פורצת
      intro: בהר הדרוזים פורצות מהומות קשות, בעקבות סירוב השלטונות הצרפתיים להחליף את מושל ההר. צבא ואווירונים נשלחים להשיב את הסדר, בני משפחת אל-אטרש מורחקים מההר, ותותחים מרעישים את מרכזי ההתקוממות.
      from: "1925-07-01"
      to: "1925-07-31"
    - title: המצור על סוידה
      intro: המרד מתרחב. המורדים מורידים אווירונים צרפתיים ומקיפים את סוידה. מנהיגי הדרוזים מציבים תנאים להפסקת אש, המגעים נכשלים, והם מכריזים על ממשלה ערבית של סוריה.
      from: "1925-08-01"
      to: "1925-09-30"
    - title: ההתקוממות מגיעה לגבול ארץ ישראל
      intro: הצרפתים מפיצים כרוז מאיים, הדרוזים טובחים בנוצרים בכפר כוכבא ופליטים נוהרים אל ארץ ישראל. ליד צפת נתפסת קבוצה של דרוזים חמושים, מפקד של המורדים מאיים על חיי הנציב העליון הצרפתי, ובלונדון נדונה שאלת הגבול בין סוריה לארץ ישראל.
      from: "1925-10-01"
      to: "1925-12-31"
    - title: המרד נמשך
      intro: בלבנון שורר שקט והדרוזים והנוצרים כורתים ברית שלום, אך מנהיג המורדים קורא לגיוס כללי בסוריה, ובחוראן מדווחים על פגיעה גם במושבות יהודיות.
      from: "1926-01-01"
  keywords: ["הדרוזים", "ג'בל דרוז", "הר הדרוזים", "הר־הדרוזים", "המורדים בסוריה", "סולטן פחה", "סולטן אל־אטרש"]
  intro: |
    בג'בל דרוז, בדרום סוריה, מתקוממים הדרוזים נגד השלטון הצרפתי. צבא ואווירונים צרפתיים נשלחים להשיב את הסדר, סוידה נתונה במצור, ניסיונות להפסקת אש נכשלים והדרוזים מכריזים על ממשלה ערבית של סוריה.

    ההתקוממות מגיעה עד גבול ארץ ישראל: מאות דרוזים מנסים לעבור את הגבול ליד מטולה, פליטים מגיעים לראש פינה, וליד צפת נתפסת קבוצה של דרוזים חמושים. מנהיג המורדים קורא להצטרף למחנה המורדים.
zionist-congress-14:
  name: הקונגרס הציוני הארבעה עשר בווינה
  hero: "1962364796113707034"
  chapters:
    - title: לקראת הקונגרס
      intro: בצל תקיפות של אנטישמים בווינה, הלאומנים הגרמנים מסכימים לא להפריע כל עוד לא ייערכו הפגנות, והמשטרה מונעת מהיטלר להגיע לועידה אנטישמית שתתקיים במקביל.

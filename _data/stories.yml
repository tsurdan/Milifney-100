      intro: כ־280 צירים צפויים להשתתף, וקרוב לשלושת אלפים כרטיסי אורחים נמכרים. כתבי "הארץ" ו"דאר היום" מעריכים את מעמדו של חיים ויצמן באופן שונה, ובסוף מאושרים תקציבים חדשים ומתקבלת החלטה לדרוש עלייה חופשית לארץ ישראל.
      from: "1925-08-17"
      to: "1925-09-01"
    - title: אחרי הקונגרס
      intro: הממשלה הסובייטית מתחקה אחר פרטי הקונגרס בעזרת נציגים שהיו נוכחים גם בישיבות הסגורות, ועורכי עיתון אנטישמי באוסטריה נידונים למאסר על תעמולתם בזמן הקונגרס.
      from: "1925-09-02"
  keywords: ["הקונגרס הי\"ד", "הקונגרס הציוני", "הכנסיה הגדולה"]
  intro: |
    בווינה מתכנס הקונגרס הציוני הארבעה עשר, בצל תקיפות של אנטישמים מקומיים ואיומים להפריע לו. כ־280 צירים צפויים להשתתף, והקונגרס מגיע להחלטה לדרוש עלייה חופשית לארץ ישראל.

    גם הערכת הקונגרס אינה אחידה: "הארץ" ו"דאר היום" שולחים כתבים שמגיעים למסקנות שונות על מעמדו של חיים ויצמן, נשיא הקונגרס. במקביל נערכת בעיר ועידה אנטישמית, והמשטרה לא מאשרת להיטלר להגיע אליה.

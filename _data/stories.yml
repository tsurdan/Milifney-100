# Ongoing stories. Curated by hand: each story is a hub page at /stories/<slug>/.
# `keywords` (and `exclude`) are matched against each post's title and text by
# scripts/generate_site_data.py, which adds the story slug to the post's `stories`
# front matter. Matching never removes a slug that was added another way.
# A story page is published once it has at least 3 posts.
druze-revolt:
  name: המרד הדרוזי בסוריה
  keywords: ["הדרוזים", "ג'בל דרוז", "הר הדרוזים", "הר־הדרוזים", "המורדים בסוריה", "סולטן פחה", "סולטן אל־אטרש"]
  intro: |
    בקיץ 1925 פרצה בג'בל דרוז, בדרום סוריה, התקוממות נגד השלטון הצרפתי, והעיתונות העברית עקבה אחריה שבוע אחר שבוע. הידיעות כאן מתחילות במהומות הראשונות ביולי: צבא ואווירונים צרפתיים נשלחים להשיב את הסדר, אחר כך מצור על סוידה, ניסיונות להפסקת אש שנכשלים והכרזה של הדרוזים על ממשלה ערבית של סוריה.

    בסתיו 1925 הגיעו הדי ההתקוממות אל גבול ארץ ישראל: מאות דרוזים ניסו לעבור את הגבול ליד מטולה, פליטים הגיעו לראש פינה, וליד צפת נתפסה קבוצה של דרוזים חמושים. הדיווחים נמשכים עד 1926, כשמנהיג המורדים קורא להצטרף למחנה המורדים.
zionist-congress-14:
  name: הקונגרס הציוני בווינה, 1925
  keywords: ["הקונגרס הי\"ד", "הקונגרס הציוני", "הכנסיה הגדולה"]
  intro: |
    באוגוסט 1925 התכנס בווינה הקונגרס הציוני הארבעה עשר. הידיעות כאן מלוות אותו מההכנות, בצל תקיפות של אנטישמים מקומיים ואיומים להפריע לקונגרס, דרך פתיחתו, שבה צפו להשתתפות של כ־280 צירים, ועד נעילתו ב־1 בספטמבר, עם החלטה לדרוש עלייה חופשית לארץ ישראל.

    גם הערכת הקונגרס לא הייתה אחידה: "הארץ" ו"דאר היום" שלחו כתבים שהגיעו למסקנות שונות על מעמדו של חיים ויצמן, נשיא הקונגרס. בין הידיעות גם דיווח על כך שהמשטרה לא אישרה להיטלר להגיע לוועידה אנטישמית שנערכה במקביל.
western-wall-1925:
  name: המאבק על הכותל המערבי
  keywords: ["הכותל"]
  intro: |
    הכותל המערבי עלה לכותרות בעיתונות העברית כבר ב־1925. הסיפור מתחיל ביום הכיפורים של אותה שנה, כששוטרים לקחו ממתפללי הכותל את כיסאותיהם: מאז 1923 נאסר להעמיד שם ספסלים וכיסאות, והמופתי דרש לשמור על הסטטוס קוו.

    בעקבות האירוע נערכו אסיפות מחאה, ובחודשים שאחרי כן דיווחו העיתונים על הצקות למתפללים, על תקריות אלימות בעיר העתיקה ועל אירוע ה"פצצה" ליד הכותל ביום הכיפורים 1926.
ibn-saud-hejaz:
  name: אבן סעוד וחג'אז
  keywords: ["אבן סעוד", "אבן־סעוד", "מלך חג'אז", "מלך חיג'אז", "מלכות עלי"]
  intro: |
    בין 1925 ל־1926 שינה אבן סעוד, מנהיג הווהאבים, את מפת חצי האי ערב. הידיעות כאן מלוות את הדרך: ביולי 1925 דיווח עיתון מכה על כוונתו להקים מדינה ערבית עצמאית, בדצמבר ברח המלך עלי מג'דה והווהאבים השתלטו על העיר, ובינואר 1926 הוכרז אבן סעוד למלך חג'אז.

    בהמשך מסרו העיתונים על מתיחות בינו לבין אימאם תימן.
turkey-hat-law:
  name: חוק הכובע בטורקיה
  keywords: ["חבישת הכובע", "כובע אירופ", "הכובע האירופ", "כובעים אירופ", "טירוף הכובעים", "המלחמה על הכובע", "התרבוש", "מתנגדי כובעים", "גלויי ראש", "עם כובע", "בלי כובע", "אפנדי", "וכובע"]
  intro: |
    בסתיו 1925 דרשה ממשלת טורקיה מאזרחיה לחבוש כובע אירופי במקום התרבוש. העיתונות העברית תיעדה את המאבק על הכובע: רבני קושטא קיבלו הוראה לחבוש כובע, בתי ספר סירבו לקבל תלמידים בלי כובע, פקידים פוטרו והתואר "אפנדי" עמד לעבור מהעולם.

    בהמשך דיווחו העיתונים על מעצרים ועל גזרי דין מוות למתנגדי החוק, ובאוקטובר 1926 נשמע גם נאום של הנשיא מוסטפא כמאל נגד התרבוש.
fascist-italy:
  name: איטליה של מוסוליני
  keywords: ["מוסוליני", "פאשיסט", "פשיסט", "פאשיזם", "פשיזם", "פאשיזמוס", "פשיזמוס"]
  exclude: ["בבלגיה", "ז'בוטינסקי", "האנשים הגדולים"]
  intro: |
    עשרות ידיעות של התקופה עוסקות בהתבססות המשטר הפאשיסטי באיטליה. הן מתעדות את השתקת העיתונות המתנגדת, חוק שהופך את מוסוליני לאחראי רק בפני המלך, מונופול פאשיסטי על האגודות המקצועיות, מעצרים לאחר קשר להתנקש בחייו בנובמבר 1925 וניסיון התנקשות באפריל 1926.

    הסיפור מגיע עד אוקטובר 1926, עם חגיגות ארבע שנים לשלטון הפאשיסטי.
locarno:
  name: הסכמי לוקרנו
  keywords: ["לוקרנו", "לוקארנו"]
  intro: |
    בסתיו 1925 סיכמו מעצמות אירופה את הסכמי לוקרנו. הידיעות כאן מלוות את האשרור והחתימה: הפרלמנט הבריטי אישר את ההסכם בנובמבר, הרייכסטאג הגרמני אישר אותו ימים אחדים אחר כך, ובתחילת דצמבר נערך בלונדון טקס חתימה חגיגי.

    בהמשך עלה גם החשש שנאום שר החוץ הגרמני בגרמנית בטקס יוביל לדרישה להפוך את הגרמנית לשפה רשמית בחבר הלאומים.

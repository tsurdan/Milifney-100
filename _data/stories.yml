  keywords: ["לוקרנו", "לוקארנו"]
  intro: |
    מעצמות אירופה מסכמות את הסכמי לוקרנו, וההסכם עובר אשרור וחתימה: הפרלמנט הבריטי מאשר אותו, הרייכסטאג הגרמני מאשר אותו ימים אחדים אחר כך, ובלונדון נערך טקס חתימה חגיגי.

    נאום שר החוץ הגרמני בגרמנית בטקס מעורר חשש מדרישה להפוך את הגרמנית לשפה רשמית בחבר הלאומים.

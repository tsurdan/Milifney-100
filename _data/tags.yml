  description: גילויי שנאת יהודים, פרעות והסתה אנטישמית ברחבי העולם.
  intro: |
    דיווחים על גילויי שנאת יהודים, פרעות והסתה ברחבי אירופה ומחוץ לה. בין הסיפורים בארכיון: ההסתה סביב הקונגרס הציוני בווינה בקיץ 1925, ו"משפט רודולף האס" בגרמניה, שכונה בעיתונות "משפט דרייפוס הגרמני".
- slug: british-mandate
  name: המנדט הבריטי
  description: מדיניות, פקודות ומינויים של ממשלת המנדט הבריטי בארץ ישראל.
  intro: |
    ידיעות על ממשלת המנדט בארץ ישראל: מינויים, פקודות, היחס ליישוב העברי ולערבים, ועל הנציב העליון. בתקופה שהארכיון מכסה הסתיימה כהונתו של הנציב הבריטי הרברט סמואל, ובאה אחריו כהונתו של הלורד פלומר.

# Fixed tag vocabulary. Slugs are used in post front matter and URLs (/tags/<slug>/).
# This is the single source of truth shared by the site (Liquid) and scripts/tag_posts.py.
# Order matters: the search page shows the first few tags (most used) by default.
- slug: world-politics
  name: פוליטיקה עולמית
  description: דיפלומטיה בינלאומית, הסכמים ומדיניות ממשלות ברחבי העולם.
  intro: |
    החלטות של ממשלות, הסכמים בין מדינות וסכסוכים מדיניים. בין הסיפורים החוזרים: הסכמי לוקרנו, התבססות המשטר הפאשיסטי באיטליה, ההתקוממות הדרוזית נגד הצרפתים בסוריה, עלייתו של רזא חאן בפרס, אבן סעוד בחג'אז והמאבק על הכובע בטורקיה.
- slug: yishuv
  name: יישוב הארץ
  description: עלייה, התיישבות חקלאית ובניין הארץ בידי היישוב היהודי בפלשתינה (א"י).
  intro: |
    חדשות היישוב היהודי בארץ ישראל: עלייה והתיישבות, ההסתדרות ואגודות העובדים, גיוס כספים לקרן היסוד ולקרן הקיימת, ובחירות לאספת הנבחרים השנייה, שבהן נשים בוחרות ונבחרות לראשונה.

    לצד הבנייה נשמעים גם הוויכוחים הקולניים בין הזרמים בתוך היישוב.
- slug: crime-justice
  name: פשע ומשפט
  description: פשעים, משפטים ופסקי דין מרחבי העולם.
- slug: culture-arts
  name: תרבות ואמנות
  description: תיאטרון, ספרות, אמנות ואירועי תרבות.
  intro: |
    תערוכות, תיאטרון, ספרות ואירועי תרבות. בין הידיעות הבולטות: התערוכה החמישית של אגודת האמנים במגדל דוד, ומותו של הקוסם הארי הודיני.
- slug: jewish-diaspora
  name: יהדות התפוצות
  description: חדשות מקהילות יהודיות ברחבי העולם - אירופה, ארצות הברית וארצות ערביות.
- slug: religion
  name: דת ומסורת
  description: רבנים, בתי כנסת, הלכה, חגים ומחלוקות דתיות בקהילה היהודית.
- slug: economy
  name: כלכלה ומסחר
  description: מטבע, מסחר, מיסים ואירועים כלכליים.
- slug: antisemitism
  name: אנטישמיות
  description: גילויי שנאת יהודים, פרעות והסתה אנטישמית ברחבי העולם.
  intro: |
    גילויי שנאת יהודים, פרעות והסתה ברחבי אירופה ומחוצה לה. בין הסיפורים: ההסתה סביב הקונגרס הציוני בווינה, ו"משפט רודולף האס" בגרמניה, שכונה "משפט דרייפוס הגרמני".
- slug: british-mandate
  name: המנדט הבריטי
  description: מדיניות, פקודות ומינויים של ממשלת המנדט הבריטי בארץ ישראל.
  intro: |
    ממשלת המנדט בארץ ישראל: מינויים, פקודות, היחס ליישוב העברי ולערבים, והנציב העליון. הרברט סמואל מסיים את כהונתו כנציב הבריטי, והלורד פלומר נכנס לתפקיד.
- slug: military
  name: צבא
  description: פעולות צבא, לחימה וכוחות חימוש במדינות שונות.
- slug: jewish-arab-relations

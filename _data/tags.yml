# Fixed tag vocabulary. Slugs are used in post front matter and URLs (/tags/<slug>/).
# This is the single source of truth shared by the site (Liquid) and scripts/tag_posts.py.
# Order matters: the search page shows the first few tags (most used) by default.
- slug: world-politics
  name: פוליטיקה עולמית
  description: דיפלומטיה בינלאומית, הסכמים ומדיניות ממשלות ברחבי העולם.
  intro: |
    זה המדור הגדול ביותר בארכיון: ידיעות על החלטות של ממשלות, הסכמים בין מדינות וסכסוכים מדיניים מיוני 1925 ועד נובמבר 1926. בין הסיפורים החוזרים: הסכמי לוקרנו, התבססות המשטר הפאשיסטי באיטליה, ההתקוממות הדרוזית נגד הצרפתים בסוריה, עלייתו של רזא חאן בפרס, אבן סעוד בחג'אז והמאבק על הכובע בטורקיה.

    הידיעות מופיעות כפי שפורסמו אז, בשמות ובאיות של העיתונות העברית של התקופה.
- slug: yishuv
  name: יישוב הארץ
  description: עלייה, התיישבות חקלאית ובניין הארץ בידי היישוב היהודי בפלשתינה (א"י).
  intro: |
    היישוב היהודי בארץ ישראל בשנות 1925–1926, כפי שהעיתונות העברית תיעדה אותו יום אחר יום. הידיעות עוסקות בעלייה ובהתיישבות, בהסתדרות ובאגודות העובדים, בגיוס הכספים של קרן היסוד והקרן הקיימת, וגם בבחירות לאספת הנבחרים השנייה, שבהן נשים בחרו ונבחרו לראשונה.

    הדיווחים מראים גם את הוויכוחים הקולניים בין הזרמים בתוך היישוב.
- slug: crime-justice
  name: פשע ומשפט
  description: פשעים, משפטים ופסקי דין מרחבי העולם.
- slug: culture-arts
  name: תרבות ואמנות
  description: תיאטרון, ספרות, אמנות ואירועי תרבות.
  intro: |
    תערוכות, תיאטרון, ספרות ואירועי תרבות בעיתונות העברית של 1925–1926. בין הידיעות הבולטות: התערוכה החמישית של אגודת האמנים במגדל דוד במרץ 1926, ומותו של הקוסם הארי הודיני בסוף אוקטובר אותה שנה.

# Fixed tag vocabulary. Slugs are used in post front matter and URLs (/tags/<slug>/).
# This is the single source of truth shared by the site (Liquid) and scripts/tag_posts.py.
# Order matters: the search page shows the first few tags (most used) by default.
- slug: world-politics
  name: פוליטיקה עולמית
  description: דיפלומטיה בינלאומית, הסכמים ומדיניות ממשלות ברחבי העולם.
  intro: |
    החלטות של ממשלות, הסכמים בין מדינות וסכסוכים מדיניים. בין הסיפורים החוזרים: הסכמי לוקרנו, התבססות המשטר הפאשיסטי באיטליה, ההתקוממות הדרוזית נגד הצרפתים בסוריה, עלייתו של רזא חאן בפרס, אבן סעוד בחג'אז והמאבק על הכובע בטורקיה.
- slug: yishuv
  name: יישוב הארץ
  description: עלייה, התיישבות חקלאית ובניין הארץ בידי היישוב היהודי בפלשתינה (א"י).
  intro: |
    חדשות היישוב היהודי בארץ ישראל: עלייה והתיישבות, ההסתדרות ואגודות העובדים, גיוס כספים לקרן היסוד ולקרן הקיימת, ובחירות לאספת הנבחרים השנייה, שבהן נשים בוחרות ונבחרות לראשונה.

    לצד הבנייה נשמעים גם הוויכוחים הקולניים בין הזרמים בתוך היישוב.
- slug: crime-justice
  name: פשע ומשפט
  description: פשעים, משפטים ופסקי דין מרחבי העולם.
  intro: |
    פשעים, משפטים ופסקי דין מכל קצוות העולם: גל פרעות אנטישמיות פוקד את רומניה, קשר להתנקשות בחיי בניטו מוסוליני נחשף באיטליה, ושודדים ופורעים מוטלים לדין בירושלים, בתל אביב ובכפרי הארץ.

    לצד הפשע נדונה גם המערכת עצמה: זקן השופטים בארץ ישראל מתפטר על רקע מתיחות בין בתי המשפט לממשלה, ובניו יורק נערך אפילו משפט סימולטני, שאינו רציני לגמרי, נגד משה רבנו בגין רצח האיש המצרי.
- slug: culture-arts
  name: תרבות ואמנות
  description: תיאטרון, ספרות, אמנות ואירועי תרבות.
  intro: |
    תערוכות, תיאטרון, ספרות ואירועי תרבות. בין הידיעות הבולטות: התערוכה החמישית של אגודת האמנים במגדל דוד, ומותו של הקוסם הארי הודיני.
- slug: jewish-diaspora
  name: יהדות התפוצות
  description: חדשות מקהילות יהודיות ברחבי העולם - אירופה, ארצות הברית וארצות ערביות.
  intro: |
    קהילות יהודיות בפזורה, בין פריחה למצוקה: גלי פרעות אנטישמיות פוקדים את רומניה והונגריה, הרווארד מנהיגה הגבלות קבלה המתחשבות בגזע, וחסידי גור פורצים באלימות לביתו של רבם בוורשה.

    לצד זאת גם סיפורי עלייה: הרב ישראל מאיר הכהן, בעל ה"חפץ חיים", עולה לארץ עם משפחתו להקים ישיבה בפתח תקווה, והרב מאיר ברלין משתקע בירושלים, בעוד בווינה מתכנס הקונגרס הציוני הארבעה עשר.
- slug: religion
  name: דת ומסורת
  description: רבנים, בתי כנסת, הלכה, חגים ומחלוקות דתיות בקהילה היהודית.
  intro: |
    הלכה ומסורת בין ארץ ובתפוצות: ויכוחים על נסיעה ועבודה בשבת בתל אביב, עלייתו של הרב ישראל מאיר הכהן ("החפץ חיים") להקים ישיבה חדשה בפתח תקווה, והמאבק המתמשך על זכויות התפילה בכותל המערבי.

    ברקע ממשיכות גם מחלוקות רחבות יותר - בין חופש המדע למסורת הדתית, ובין זרמים שונים ביהדות, כמו הדרשה הפורצת דרך שנשאה הגברת לילית מונטגיו בבית כנסת ליברלי בלונדון.
- slug: economy
  name: כלכלה ומסחר
  description: מטבע, מסחר, מיסים ואירועים כלכליים.
  intro: |
    כלכלת היישוב והעולם: קריאות לרכישת מניות בנק הפועלים, תקציב ההנהלה הציונית לשנה הבאה, וחברת החשמל שמגיעה סוף־סוף לטבריה. בפולין מתפללים להבראת הזלוטי המתמוטט, ובארצות הברית נמשכת המלחמה במשקאות החריפים בצל חוק היובש.

    גם שערוריות אינן נעדרות: בכיר במשרד החוץ הגרמני נחשף כמי שניצל שנים ארוכות מידע פוליטי חסוי כדי להתעשר בבורסה.
- slug: antisemitism
  name: אנטישמיות
  description: גילויי שנאת יהודים, פרעות והסתה אנטישמית ברחבי העולם.
  intro: |
    גילויי שנאת יהודים, פרעות והסתה ברחבי אירופה ומחוצה לה. בין הסיפורים: ההסתה סביב הקונגרס הציוני בווינה, ו"משפט רודולף האס" בגרמניה, שכונה "משפט דרייפוס הגרמני".
- slug: british-mandate
  name: המנדט הבריטי
  description: מדיניות, פקודות ומינויים של ממשלת המנדט הבריטי בארץ ישראל.
  intro: |
    ממשלת המנדט בארץ ישראל: מינויים, פקודות, היחס ליישוב העברי ולערבים, והנציב העליון. הרברט סמואל מסיים את כהונתו כנציב הבריטי, והלורד פלומר נכנס לתפקיד.
- slug: military
  name: צבא
  description: פעולות צבא, לחימה וכוחות חימוש במדינות שונות.
  intro: |
    התחמשות ועימותים צבאיים מרחבי העולם: איטליה ויוון בונות מחדש את צבאותיהן, גרמניה שולחת אנשי ים לסייע בחיפוש אחר צוללת בריטית טובעת, ודיווחים מגיעים על תקריות ימיות בין אמריקאים לסינים במזרח הרחוק.

    בארץ ישראל ובסוריה השכנה הסכסוך הצבאי קרוב במיוחד: צבא צרפת נלחם במרד הדרוזי בהר הדרוזים ובמצור על סוידה, וחיילים יהודים בפולין זוכים להתחשבות בענייני כשרות.
- slug: jewish-arab-relations
  name: יחסי יהודים-ערבים
  description: עימותים, משא ומתן והתרחשויות סביב היחסים בין יהודים לערבים בארץ ישראל, ובהם הסכסוך סביב הכותל המערבי.
  intro: |
    המתח סביב הכותל המערבי עומד במרכז היחסים בין יהודים לערבים: שוטרים ערבים לוקחים כיסאות ממתפללי הכותל ביום הכיפורים, חאג' אמין אל־חוסייני דורש לשמור על הסטטוס קוו, ומתקיימות אסיפות מחאה יהודיות ברחבי הארץ.

    לצד זאת, התקפות על נוסעים בדרך יפו־ירושלים, מחלוקת על העסקת פועלים ערבים מול פועלים יהודים מובטלים, והוועד הפועל הערבי מתלונן בלונדון על מדיניות הקרקעות של הממשלה.
- slug: curiosities
  name: סקרנות ומוזרויות
  description: סיפורים תמוהים ומוזרים במיוחד, ותופעות יוצאות דופן.
  intro: |
    הסיפורים התמוהים והמשעשעים ביותר של התקופה: קוף שימפנזה נקנס על עישון בפומבי באינדיאנה, גנן אנגלי מגלה שרדיו מזרז את צמיחת הירקות במשתלתו, ושודד רומנטי בקורסיקה זוכה ללוויה המונית למרות עברו הפלילי.

    יש גם תגליות מוזרות יותר: שבט גמדים שוכני ביצות המתגלה כביכול באוסטרליה, וצמח מקסיקני שאבקתו גורמת, כך נטען, לחלומות בהקיץ.
- slug: jerusalem
  name: ירושלים
  description: חדשות עירוניות מירושלים ועיריית העיר.
  intro: |
    חדשות העיר ירושלים, הקהילה היהודית, העירייה והמאבקים סביב המקומות הקדושים. במרכז הידיעות עומד הכותל המערבי, שעולה לכותרות ביום הכיפורים וחוזר ועולה שוב ושוב.
- slug: transportation
  name: תחבורה ותשתיות
  description: מסילות ברזל, נמלים ותשתיות תחבורה.
  intro: |
    מסילות ברזל ותשתיות תחבורה בארץ ובעולם: עבודות סלילה למסילה חדשה בין חיפה לביירות, הפסקות חוזרות ברכבת ובטלגרף בין חיפה לדמשק, ולוחות זמנים משתנים בקווי עזה ובאר שבע.

    בלונדון נפתח קטע חדש של הרכבת התחתית, ובארצות הברית מתפרסמים נתונים מדאיגים על הרוגי תאונות דרכים - כ-25 אלף בשנה אחת, ובהם כ-6,000 ילדים.
- slug: monarchy
  name: מלוכה
  description: חדשות על מלכים, נסיכים ובתי מלוכה באירופה ובמזרח התיכון.
  intro: |
    בתי מלוכה מתערערים ומתחדשים: השאה רזא חאן פהלווי עולה לשלטון בפרס ומבקש להחיות את זוהרה הקודם, צרפת מכירה בממלכת עיראק בראשות המלך פייסל, ואבן סעוד מוכרז למלך חג'אז לאחר בריחת המלך עלי ממכה.

    לצד זאת ניסיונות התנקשות במלכים - באלפונסו השלושה עשר מלך ספרד ובפרדיננד מלך רומניה - ומלך יוון שוקל לוותר מרצונו על הכתר אם יוכח לו שהעם מתנגד למונרכיה.
- slug: science-tech
  name: מדע וטכנולוגיה
  description: גילויים מדעיים, המצאות טכנולוגיות וחידושים בתחומי המדע.
  intro: |
    גילויים מדעיים וחידושים טכנולוגיים מכל העולם: חוקרים בלונדון מכריזים על תגלית בנוגע לגרעין מחלת הסרטן, בהודו ובדרום אפריקה מפתחים קופסאות זכוכית להפקת חשמל מקרני השמש, ומחלקת החקלאות האמריקאית מדווחת על התמעטות מדאיגה בלידות סוסים.

    יש גם תגליות שנויות במחלוקת: ניסיון להילחם בזקנה באמצעות השתלת אשכי קוף, וטענה ארכיאולוגית תמוהה על גילוי כלי זינו של שאול המלך בארץ ישראל.
- slug: tel-aviv
  name: תל אביב
  description: חדשות עירוניות מתל אביב-יפו ועיריית העיר.
  intro: |
    תל אביב הצעירה גדלה ומתפתחת: העירייה קובעת תקנות תנועה חדשות לרכבים ולרוכבי חיות, בתי הספר בעיר מונים כבר כ-9,500 תלמידים, ורעש אדמה קל מורגש ברחובותיה.

    לצד הצמיחה ממשיכים גם ויכוחי השבת: מכירת חמאה וגבינה בפרהסיה מעוררת את זעם חברי "משמרת השבת", ונסיעה באוטומובילים בשבת מגיעה עד לבית המשפט העירוני.
- slug: education
  name: חינוך
  description: בתי ספר, אוניברסיטאות ומדיניות חינוכית.
  intro: |
    חינוך והשכלה בין ארץ ישראל לעולם: הטכניון מחמיר את תנאי הקבלה ודורש תעודת בגרות ושנת עבודה מעשית, ומחלקת החינוך בתל אביב מבטלת את שכר הלימוד עבור תושבי העיר.

    בעולם, הרווארד מנהיגה הגבלות קבלה אנטישמיות, בצרפת דנים בירידה חמורה ברמת ההשכלה, והנדבן ג'ון ד. רוקפלר תורם שני מיליון דולר לחינוך האפרו-אמריקאים בארצות הברית.
- slug: disasters
  name: אסונות ותאונות
  description: שריפות, שיטפונות, רעידות אדמה ותאונות.
  intro: |
    אסונות טבע ותאונות קטלניות מרחבי העולם: שיטפון באתונה הורס יותר ממאה בתים וגובה 24 קורבנות, הוריקן מחריב כליל את הוליווד שבארצות הברית, ורעידות אדמה פוקדות את גרמניה ובלגיה בעקבות שיטפונות, לצד התפרצות הר הגעש וזוביוס.

    גם בתחבורה נגבה מחיר כבד: כ-25 אלף הרוגים בתאונות דרכים בארצות הברית בשנה אחת, שתי רכבות מתנגשות סמוך ללונדון, ומטוס צרפתי מתרסק והורג חמישה.
- slug: revolts
  name: מרידות
  description: התקוממויות ומרידות, ובהן מרד הדרוזים בסוריה ומרד הריף במרוקו.
  intro: |
    מרידות והתקוממויות מקצוות העולם: המרד הדרוזי בהר הדרוזים שבסוריה מול הצבא הצרפתי, מהפכה באקוודור שבה מודח הנשיא, ומרד צבאי בטהראן שבפרס.

    ברוסיה הסובייטית נעצרים ארבעים ואחד יהודים באשמת פעילות ציונית, ובסיביר מת אסיר ציון בשביתת רעב; בוושינגטון, לעומת זאת, תהלוכת הקו־קלוקס־קלן מצטמצמת לאחר שהוטל איסור על הסתרת פנים.
- slug: health
  name: בריאות ומגפות
  description: מחלות, מגפות ואירועי בריאות ציבורית.
  intro: |
    בריאות הציבור ומגפות מטרידות את התקופה: מגפת הדבר מגיעה לעזה, גלי חום בלונדון ובניו יורק גובים קורבנות רבים בעיקר בקרב קשישים, וחוקרים מנסים לפענח את גרעין מחלת הסרטן.

    בארץ ישראל דנים בהקמת "מגן דוד אדום" עולמי, עיריית תל אביב נאבקת במכת עכברים וכלבים משוטטים, ומקרה נדיר של נשיכת עכביש קטלנית מסעיר את ירושלים.
- slug: press
  name: עיתונות ותקשורת
  description: חדשות על עיתונים, עיתונאים וחופש העיתונות.
  intro: |
    עיתונות וחופש הביטוי תחת לחץ: באיטליה הפאשיסטים פורעים במערכות עיתוני האופוזיציה ועורך "קוריירה דלה סרה" נאלץ להתפטר, וביוון ובבולגריה נסגרים עיתונים בפקודת השלטון.

    בארץ ישראל שובתים העיתונים הערביים נגד העלאת דמי המשלוח, ו"הארץ" ו"דאר היום" מחליפים האשמות. במוסקבה, לעומת זאת, מכחישים פעמיים שמועות על רצח סטלין שמתבררות כבדותא.
- slug: women-society
  name: נשים וחברה
  description: מעמד האישה, אופנה ותמורות חברתיות.
  intro: |
    מעמד האישה משתנה: בבחירות לאספת הנבחרים השנייה נשים בוחרות ונבחרות לראשונה, הגברת לילית מונטגיו נושאת דרשה בבית כנסת ליברלי בלונדון בתקדים היסטורי, ובברלין מתמנה לראשונה אישה לתפקיד תובעת כללית.

    לצד זאת גם מאבקים ולעג: אנטישמים באוסטריה מאשימים את היהודים ב"אשמת" אופנת השיער הקצר של נשים, ועיריית חיפה אוסרת על רחצה מעורבת בים.
- slug: haifa
  name: חיפה
  description: חדשות עירוניות מחיפה ועיריית העיר.
  intro: |
    חיפה הצומחת ושעריה לעולם: מסילות ברזל מקשרות אותה לביירות ולדמשק, אך גם נקטעות שוב ושוב בשל אי־שקט אזורי, ותוכנית לרכבת הרים בין העיר להר הכרמל מתקדמת.

    העיר קולטת גם פליטים מהמרד הדרוזי בסוריה הסמוכה, ולצד הפיתוח נמשכים ויכוחי דת ומסורת - כמו האיסור על רחצה מעורבת בים והמשבר סביב כשרות הבשר בעיר.
- slug: sports
  name: ספורט
  description: תחרויות ואירועי ספורט מרחבי העולם.
  intro: |
    ספורט בארץ ובעולם, לעיתים גם בצל מתיחות: קבוצת מכבי תל אביב מפסידה במשחקה הראשון בווינה, ואילו "המכבים" מנצחים נבחרת אנגלים במשחק שבין יפו לתל אביב.

    לא תמיד הכל מתנהל בשקט: משחק כדורגל בלודז' מסתיים בתקיפת השופט, ההסתדרות האוסטרית לסקי מוציאה יהודים משורותיה, והרב קוק נפגש עם משלחת מכבי־חשמונאי כדי למנוע חילול שבת במגרש הכדורגל בירושלים.

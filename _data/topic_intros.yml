adolf-hitler: |
  אדולף היטלר הוא מנהיג "ההסתדרות האנטישמית של הפועלים הסוציאליסטים הלאומיים" בבוואריה, ומהבולטים שבאנטישמים בגרמניה. בנובמבר 1923 ניסה יחד עם המצביא לודנדורף לתפוס את השלטון במינכן, ב"פוטש במרתף הבירה" שיצא מאולם הבירה בירגרברויקלר, ונכשל. הוא נידון לחמש שנות מאסר, אך שוחרר מכלא לנדסברג כעבור פחות משנה, ובפברואר 1925 ייסד את מפלגתו מחדש.

  בקיץ 1925 [יוצא לאור ספרו "מיין קאמפף"](/1925/07/18/1946148047710298244/). היטלר עובר בין ערי גרמניה ונושא נאומים אנטישמיים, ובעקבות הופעותיו מתרבים מקרי התעללות ביהודים. השלטונות מנסים לבלום אותו: בבוואריה [ובפרוסיה](/1925/09/30/1972874040667979902/) נאסר עליו לנאום, ובווינה [המשטרה אינה מרשה לו להגיע](/1925/08/14/1955947515737514114/) לוועידה האנטישמית שמתכנסת במקביל לקונגרס הציוני.

  רבים בגרמניה סבורים שזמנה של התנועה ההיטלרית [כבר עבר](/1926/06/20/2068413121559928933/). המפלגה קטנה ומפולגת, [הנאצים האוסטרים פורשים ממנה](/1926/09/03/2095374111526535404/), והיטלר עצמו [מקווה לזכות בבחירות הבאות בארבעה מושבים נוספים לכל היותר](/1926/06/29/2071543607287525818/).
